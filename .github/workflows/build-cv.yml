name: Build CV

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: cv
          root_file: main.tex

      - name: Publish cv.pdf to repo root
        run: |
          mv cv/main.pdf cv.pdf
          git add cv.pdf
          if git diff --cached --quiet; then
            echo "cv.pdf unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild cv.pdf from cv/main.tex [skip ci]"
          git push
